[project]
name = "btc15"
version = "0.1.0"
description = "Research and trading tools for Polymarket US 15-minute BTC up/down"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "requests>=2.25", "cryptography>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
